<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>青页 · 我的阅读花园</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="literary-map.css"><link rel="stylesheet" href="reading-update.css"></head>
<body><aside><a class="brand" href="#home"><span class="logo">◒</span> 青页<small>MY READING GARDEN</small></a><nav aria-label="主导航"><a href="#home">⌂ <span>阅读花园</span></a><a href="#reviews">☷ <span>我的书评</span></a><a href="#books">▤ <span>我的书单</span></a><a href="#year">◷ <span>年终报告</span></a><a href="#heat">▦ <span>阅读热力图</span></a><a href="#map">◎ <span>文学地图</span></a></nav><div class="aside-bottom"><span class="dot"></span> 慢慢读，自有收获<p>一个人的阅读，一座小小的花园。</p></div></aside><main><header><span>给阅读留一点空间</span><div><button class="quiet" id="export">导出备份 ↗</button><button class="primary" id="add">＋ 记录一本书</button></div></header><div id="app"></div><footer>青页 · 把读过的日子，慢慢收藏。<span>记录仅保存在本浏览器 · 记得导出备份</span></footer></main>
<dialog id="editor"><form id="book-form"><div class="dialog-head"><h2 id="dialog-title">记录一本书</h2><button type="button" class="quiet" id="close" aria-label="关闭">✕</button></div><input type="hidden" name="id"><input type="hidden" name="coverData"><section class="cover-editor"><div id="cover-preview">暂无封面</div><div class="cover-editor-info"><h3>这本书的样子</h3><p class="muted">留下与你读过的版本相同的封面。</p><label class="cover-upload-label">上传／更换封面<input id="cover-upload" type="file" accept="image/jpeg,image/png,image/webp"></label><button type="button" class="quiet" id="cover-remove" hidden>移除封面</button><p id="cover-feedback" class="muted"></p></div></section><label>书名<input name="title" required maxlength="100" placeholder="最近是哪一本书陪着你？"></label><div class="form-row"><label>作者<input name="author" maxlength="80" placeholder="作者姓名"></label><label>阅读状态<select name="status"><option value="reading">在读</option><option value="plan">计划读</option><option value="read">已读</option></select></label></div><label>译者（选填）<input name="translator" maxlength="100" placeholder="译者姓名"></label><div class="form-row"><label>阅读日期<input type="date" name="date" required></label><label>评分<select name="rating"><option value="0">暂不评分</option><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select></label></div><p class="hint">日期用于记录阅读活动；已读书籍的日期作为完成日期。</p><label>阅读感想<textarea name="review" rows="4" placeholder="写下一个句子，或一段与自己的对话……"></textarea></label><label for="country-search">作者所属国家／地区</label><div class="country-filter-row"><input id="country-search" type="search" placeholder="输入名称搜索，如：日本" aria-label="搜索国家或地区" aria-describedby="country-search-info"><select name="country" aria-label="选择作者所属国家或地区"></select></div><p id="country-search-info" aria-live="polite"></p><p class="country-help">用于文学地图着色；不确定时留空。合著或多重国籍可选择一个主要归属。</p><section class="edition-editor"><div class="section-head"><h3>选择你读的版本</h3><a id="version-search" class="edition-search" href="https://www.douban.com/search?cat=1001" target="_blank" rel="noopener noreferrer">在豆瓣选版本 ↗</a></div><div class="form-row"><label>ISBN（选填）<input name="isbn" placeholder="用 ISBN 精确搜索版本" maxlength="30"></label><label>版本备注（选填）<input name="edition" placeholder="出版社 · 出版年份" maxlength="180"></label></div><label>选好版本后，粘贴豆瓣书籍链接<input name="url" type="url" placeholder="https://book.douban.com/subject/…"></label><p class="hint">在新页面搜索并选择版本，再将地址粘贴回来。封面需自行上传，粘贴链接不会自动抓取书籍信息。</p></section><div class="dialog-actions"><button type="button" class="quiet danger" id="delete">删除记录</button><button class="primary" type="submit" id="book-save">保存记录 ↗</button></div></form></dialog><div id="toast" role="status"></div><script src="vendor/d3.min.js"></script><script src="vendor/countries.js"></script><script src="literary-map.js"></script><script src="book-cover.js"></script><script src="country-search.js"></script><script src="reading-views.js"></script><script src="app.js"></script></body></html>
